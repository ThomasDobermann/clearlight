<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Clearlight Mastering</title>
  <meta name="description" content="Get in touch with Clearlight Mastering. Tell us about your project.">
  <link rel="icon" href="assets/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.webp" alt="Clearlight Mastering">
        <span class="brand-text">
          <span class="brand-name">CLEARLIGHT MASTERING</span>
          <span class="brand-tag">A father-and-daughter mastering studio &middot; Los Angeles, CA</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="index.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <div class="contact-wrap">
    <div class="contact-inner">
      <p class="eyebrow">Contact</p>
      <h2 class="heading" style="margin-bottom:40px">Get in touch</h2>

      <form class="contact-form" id="contact-form">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required placeholder="Your name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required placeholder="Tell us about your project..."></textarea>
        </div>
        <p class="form-status" id="form-status" style="display:none"></p>
        <button type="submit" class="btn" id="submit-btn">Send Message</button>
      </form>

      <div class="contact-success" id="contact-success" style="display:none">
        <p>Message sent.</p>
        <p>We'll be in touch soon.</p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; <span id="year"></span> Clearlight Mastering &middot; Los Angeles, CA</p>
      <div class="footer-links">
        <a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a>
        <a href="https://x.com" target="_blank" rel="noopener">X / Twitter</a>
        <a href="https://facebook.com" target="_blank" rel="noopener">Facebook</a>
        <a href="https://open.spotify.com" target="_blank" rel="noopener">Spotify</a>
      </div>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
